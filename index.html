<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đếm ngược chào năm mới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,500;0,700;1,300&family=Noto+Serif+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --son:#4A0A0E;
    --son-sau:#2B0407;
    --son-nhat:#6E1218;
    --vang:#E8B341;
    --vang-sang:#F7E2AC;
    --muc:#F3E7D7;
    --muc-mo:rgba(243,231,215,.62);
    --vien:rgba(232,179,65,.38);
    --dao:#E88FA0;
    --nen-grad:radial-gradient(120% 90% at 50% 8%, #6E1218 0%, #4A0A0E 42%, #2B0407 100%);
  }
  :root:not([data-theme="dark"]){
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --son:#F6EDDD;
      --son-sau:#EFE2CC;
      --son-nhat:#FBF6EC;
      --vang:#B07A14;
      --vang-sang:#8A2620;
      --muc:#3A1210;
      --muc-mo:rgba(58,18,16,.62);
      --vien:rgba(176,122,20,.35);
      --nen-grad:radial-gradient(120% 90% at 50% 8%, #FBF6EC 0%, #F6EDDD 45%, #EDDFC7 100%);
    }
  }
  :root[data-theme="light"]{
    --son:#F6EDDD;
    --son-sau:#EFE2CC;
    --son-nhat:#FBF6EC;
    --vang:#B07A14;
    --vang-sang:#8A2620;
    --muc:#3A1210;
    --muc-mo:rgba(58,18,16,.62);
    --vien:rgba(176,122,20,.35);
    --nen-grad:radial-gradient(120% 90% at 50% 8%, #FBF6EC 0%, #F6EDDD 45%, #EDDFC7 100%);
  }
  :root[data-theme="dark"]{
    --son:#4A0A0E; --son-sau:#2B0407; --son-nhat:#6E1218;
    --vang:#E8B341; --vang-sang:#F7E2AC;
    --muc:#F3E7D7; --muc-mo:rgba(243,231,215,.62);
    --vien:rgba(232,179,65,.38);
    --nen-grad:radial-gradient(120% 90% at 50% 8%, #6E1218 0%, #4A0A0E 42%, #2B0407 100%);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:var(--son-sau);
    background-image:var(--nen-grad);
    color:var(--muc);
    font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  canvas#canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .khung{
    position:relative;z-index:1;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,4vh,44px);
    padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px);
    text-align:center;
  }

  .moc{display:inline-flex;border:1px solid var(--vien);border-radius:999px;padding:4px;gap:2px;background:rgba(0,0,0,.08)}
  .moc button{
    font:inherit;font-size:.86rem;font-weight:500;letter-spacing:.01em;
    color:var(--muc-mo);background:none;border:0;border-radius:999px;
    padding:9px 18px;cursor:pointer;transition:color .2s,background .2s;
  }
  .moc button[aria-pressed="true"]{background:var(--vang);color:var(--son-sau);}
  :root[data-theme="light"] .moc button[aria-pressed="true"],
  .moc button[aria-pressed="true"]{color:var(--son-sau)}
  .moc button:hover{color:var(--muc)}
  .moc button[aria-pressed="true"]:hover{color:var(--son-sau)}

  .dau-de{max-width:34ch}
  .dau-de h1{
    font-family:"Noto Serif Display",Georgia,serif;
    font-weight:500;margin:0;
    font-size:clamp(1.35rem,4.4vw,2.1rem);
    line-height:1.25;color:var(--vang-sang);
  }
  .dau-de p{
    margin:.55em 0 0;font-size:clamp(.88rem,2.4vw,1rem);
    color:var(--muc-mo);font-style:italic;font-family:"Be Vietnam Pro",sans-serif;
  }

  .dong-ho{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(6px,2.4vw,26px);
    width:min(880px,100%);
    border-top:1px solid var(--vien);border-bottom:1px solid var(--vien);
    padding:clamp(16px,3.4vh,30px) 0;
  }
  .o{display:flex;flex-direction:column;align-items:center;gap:.35em;position:relative}
  .o + .o::before{
    content:"";position:absolute;left:calc(-1 * clamp(3px,1.2vw,13px));top:18%;bottom:26%;
    width:1px;background:var(--vien);
  }
  .so{
    font-family:"Noto Serif Display",Georgia,serif;font-weight:700;
    font-size:clamp(2.6rem,13vw,6.4rem);
    line-height:.92;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    color:var(--vang);
    text-shadow:0 1px 0 rgba(255,255,255,.14);
  }
  :root[data-theme="dark"] .so,
  .so{text-shadow:0 0 30px rgba(232,179,65,.22)}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) .so{text-shadow:none}
  }
  :root[data-theme="light"] .so{text-shadow:none}
  .nhan{font-size:clamp(.7rem,2.2vw,.92rem);color:var(--muc-mo);font-weight:300}

  .chan{display:flex;flex-direction:column;align-items:center;gap:18px}
  .ngay-dich{font-size:clamp(.82rem,2.3vw,.95rem);color:var(--muc-mo);margin:0}
  .phao{
    font:inherit;font-size:.9rem;font-weight:500;
    color:var(--vang);background:none;
    border:1px solid var(--vien);border-radius:999px;
    padding:11px 24px;cursor:pointer;
    transition:background .2s,border-color .2s,color .2s;
  }
  .phao:hover{background:var(--vang);border-color:var(--vang);color:var(--son-sau)}
  button:focus-visible{outline:2px solid var(--vang);outline-offset:3px}

  .mung{display:none;max-width:22ch}
  .mung h2{
    font-family:"Noto Serif Display",Georgia,serif;font-weight:700;margin:0;
    font-size:clamp(2rem,9vw,4.2rem);line-height:1.05;color:var(--vang);
  }
  body.da-sang .dong-ho,body.da-sang .dau-de{display:none}
  body.da-sang .mung{display:block}

  @media (max-width:430px){
    .dong-ho{grid-template-columns:repeat(2,1fr);row-gap:20px}
    .o:nth-child(3)::before{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>

<main class="khung">
  <div class="moc" role="group" aria-label="Chọn mốc năm mới">
    <button type="button" data-moc="duong" aria-pressed="true">Tết Dương lịch</button>
    <button type="button" data-moc="am" aria-pressed="false">Tết Nguyên đán</button>
  </div>

  <div class="dau-de">
    <h1 id="tieu-de">Còn bấy nhiêu nữa là sang năm mới</h1>
    <p id="phu-de">Giao thừa tính theo giờ Việt Nam</p>
  </div>

  <div class="dong-ho" id="dong-ho" role="timer" aria-live="off">
    <div class="o"><span class="so" id="ngay">00</span><span class="nhan">ngày</span></div>
    <div class="o"><span class="so" id="gio">00</span><span class="nhan">giờ</span></div>
    <div class="o"><span class="so" id="phut">00</span><span class="nhan">phút</span></div>
    <div class="o"><span class="so" id="giay">00</span><span class="nhan">giây</span></div>
  </div>

  <div class="mung">
    <h2>Chúc mừng năm mới</h2>
    <p class="ngay-dich" id="loi-chuc">An khang, thịnh vượng, vạn sự như ý.</p>
  </div>

  <div class="chan">
    <p class="ngay-dich" id="ngay-dich"></p>
    <button class="phao" id="nut-phao" type="button">Bắn pháo hoa</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  // ============================================================
  //  CẤU HÌNH DISCORD WEBHOOK
  //  1. Vào Discord → Channel Settings → Integrations → Webhooks → New Webhook
  //  2. Copy URL dán vào dòng dưới
  // ============================================================
  var DISCORD_WEBHOOK = "https://discordapp.com/api/webhooks/1549969545463205950/W9wtmfh4eb3y_FS8fEhqwVLh7NNRDWnkoU9vvTPi1zh53USrRtcqWFiSlbqXYoMCNP74";

  // Gửi thông báo Discord (chỉ gửi 1 lần mỗi phiên)
  function guiDiscord(ip, agent, thoiGian) {
    if (!DISCORD_WEBHOOK || DISCORD_WEBHOOK.indexOf("YOUR_WEBHOOK") !== -1) return;

    var payload = {
      username: "New Year Logger",
      avatar_url: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
      embeds: [{
        title: "👤 Có người truy cập trang đếm ngược!",
        color: 15237697,
        fields: [
          { name: "🕒 Thời gian", value: thoiGian, inline: true },
          { name: "🌐 IP", value: "`" + ip + "`", inline: true },
          { name: "📱 User-Agent", value: "```" + (agent || "unknown").slice(0, 180) + "```" }
        ],
        footer: { text: "Đếm ngược năm mới" },
        timestamp: new Date().toISOString()
      }]
    };

    fetch(DISCORD_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(){});
  }

  // Lấy IP công cộng rồi gửi Discord
  (function logVisitor() {
    var agent = navigator.userAgent || "unknown";
    var thoiGian = new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" });

    fetch("https://api.ipify.org?format=json")
      .then(function(r){ return r.json(); })
      .then(function(data){
        guiDiscord(data.ip || "unknown", agent, thoiGian);
      })
      .catch(function(){
        guiDiscord("không xác định", agent, thoiGian);
      });
  })();

  // ---- Các mốc (giờ Việt Nam, UTC+7) ----
  var TET_AM = ["2027-02-06","2028-01-26","2029-02-13","2030-02-03","2031-01-23"];
  var TEN_AM = {"2027":"Đinh Mùi","2028":"Mậu Thân","2029":"Kỷ Dậu","2030":"Canh Tuất","2031":"Tân Hợi"};

  function moc(loai){
    var now = Date.now(), i, t;
    if(loai === "am"){
      for(i=0;i<TET_AM.length;i++){
        t = new Date(TET_AM[i]+"T00:00:00+07:00").getTime();
        if(t > now) return {t:t, nam:TET_AM[i].slice(0,4)};
      }
      t = new Date(TET_AM[TET_AM.length-1]+"T00:00:00+07:00").getTime();
      return {t:t, nam:TET_AM[TET_AM.length-1].slice(0,4)};
    }
    var nam = new Date().getUTCFullYear();
    for(i=0;i<3;i++){
      t = new Date((nam+i+1)+"-01-01T00:00:00+07:00").getTime();
      if(t > now) return {t:t, nam:String(nam+i+1)};
    }
    return {t:t, nam:String(nam+1)};
  }

  var loai = "duong";
  var dich = moc(loai);

  var el = {
    ngay:document.getElementById("ngay"),
    gio:document.getElementById("gio"),
    phut:document.getElementById("phut"),
    giay:document.getElementById("giay"),
    tieuDe:document.getElementById("tieu-de"),
    phuDe:document.getElementById("phu-de"),
    ngayDich:document.getElementById("ngay-dich"),
    loiChuc:document.getElementById("loi-chuc")
  };

  function hai(n){ return n < 10 ? "0"+n : String(n); }

  function moTa(){
    var d = new Date(dich.t);
    var ngayVN = new Date(d.getTime() + 7*3600*1000);
    var chuoi = "0h ngày " + ngayVN.getUTCDate() + "/" + (ngayVN.getUTCMonth()+1) + "/" + ngayVN.getUTCFullYear();
    if(loai === "am"){
      var can = TEN_AM[dich.nam] || "";
      el.tieuDe.textContent = "Còn bấy nhiêu nữa là tới giao thừa";
      el.phuDe.textContent = "Tết Nguyên đán " + (can ? can+" " : "") + dich.nam;
      el.loiChuc.textContent = "Năm " + (can || dich.nam) + " an khang, thịnh vượng, vạn sự như ý.";
    }else{
      el.tieuDe.textContent = "Còn bấy nhiêu nữa là sang năm " + dich.nam;
      el.phuDe.textContent = "Giao thừa tính theo giờ Việt Nam";
      el.loiChuc.textContent = "Chúc bạn một năm " + dich.nam + " thật nhiều sức khoẻ và may mắn.";
    }
    el.ngayDich.textContent = chuoi + ", giờ Việt Nam";
  }

  var daBan = false;
  function nhip(){
    var con = dich.t - Date.now();
    if(con <= 0){
      document.body.classList.add("da-sang");
      if(!daBan){ daBan = true; loatPhao(7); }
      return;
    }
    document.body.classList.remove("da-sang");
    var giay = Math.floor(con/1000);
    el.ngay.textContent = hai(Math.floor(giay/86400));
    el.gio.textContent  = hai(Math.floor(giay/3600)%24);
    el.phut.textContent = hai(Math.floor(giay/60)%60);
    el.giay.textContent = hai(giay%60);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".moc button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".moc button"), function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
      loai = b.getAttribute("data-moc");
      dich = moc(loai);
      daBan = false;
      moTa(); nhip();
    });
  });

  moTa(); nhip();
  setInterval(nhip, 1000);

  // ---- Hoa mai rơi + pháo hoa ----
  var cv = document.getElementById("canvas"), ctx = cv.getContext("2d");
  var W=0, H=0, dpr = Math.min(window.devicePixelRatio||1, 2);
  var rut = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function coLai(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  coLai();
  window.addEventListener("resize", coLai);

  var MAU_HOA = ["#E8B341","#F2C94C","#E88FA0","#F7E2AC"];
  var canh = [], phao = [], tan = [];

  function taoCanh(y){
    return {
      x:Math.random()*W, y:(y===undefined? Math.random()*H : y),
      r:3+Math.random()*4,
      vy:.28+Math.random()*.55,
      pha:Math.random()*Math.PI*2,
      bien:.25+Math.random()*.7,
      quay:Math.random()*Math.PI,
      vquay:(Math.random()-.5)*.02,
      mau:MAU_HOA[(Math.random()*MAU_HOA.length)|0],
      mo:.35+Math.random()*.5
    };
  }
  for(var i=0;i<46;i++) canh.push(taoCanh());

  function veCanh(p){
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.quay);
    ctx.globalAlpha = p.mo; ctx.fillStyle = p.mau;
    ctx.beginPath();
    ctx.ellipse(0,0,p.r,p.r*.62,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function banPhao(x,y){
    var mau = MAU_HOA[(Math.random()*MAU_HOA.length)|0];
    var n = 46 + (Math.random()*26|0);
    for(var i=0;i<n;i++){
      var g = (Math.PI*2*i)/n + Math.random()*.12;
      var v = 1.6 + Math.random()*3.4;
      tan.push({x:x,y:y,vx:Math.cos(g)*v,vy:Math.sin(g)*v,doi:1,mau:mau});
    }
  }
  function phongLen(){
    var x = W*(.18+Math.random()*.64);
    phao.push({x:x,y:H+8,vy:-(5.5+Math.random()*2.6),dich:H*(.16+Math.random()*.3)});
  }
  function loatPhao(n){
    for(var i=0;i<(n||4);i++) setTimeout(phongLen, i*260 + Math.random()*180);
  }
  document.getElementById("nut-phao").addEventListener("click", function(){ loatPhao(5); });

  var truoc = 0;
  function khung(ts){
    var dt = Math.min((ts - truoc)/16.67 || 1, 3); truoc = ts;
    ctx.clearRect(0,0,W,H);

    for(var i=0;i<canh.length;i++){
      var p = canh[i];
      if(!rut){
        p.y += p.vy*dt;
        p.pha += .012*dt;
        p.x += Math.sin(p.pha)*p.bien*dt;
        p.quay += p.vquay*dt;
        if(p.y - p.r > H){ canh[i] = taoCanh(-10); }
        if(p.x < -20) p.x = W+10; else if(p.x > W+20) p.x = -10;
      }
      veCanh(p);
    }

    for(var j=phao.length-1;j>=0;j--){
      var q = phao[j];
      q.y += q.vy*dt; q.vy += .07*dt;
      ctx.globalAlpha=.9; ctx.fillStyle="#F7E2AC";
      ctx.beginPath(); ctx.arc(q.x,q.y,2,0,Math.PI*2); ctx.fill();
      if(q.vy >= -.6 || q.y <= q.dich){ banPhao(q.x,q.y); phao.splice(j,1); }
    }

    for(var k=tan.length-1;k>=0;k--){
      var t = tan[k];
      t.x += t.vx*dt; t.y += t.vy*dt;
      t.vy += .045*dt; t.vx *= .985; t.vy *= .985;
      t.doi -= .012*dt;
      if(t.doi <= 0){ tan.splice(k,1); continue; }
      ctx.globalAlpha = Math.max(t.doi,0); ctx.fillStyle = t.mau;
      ctx.beginPath(); ctx.arc(t.x,t.y,1.9,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(khung);
  }
  requestAnimationFrame(khung);
})();
</script>
</body>
</html>
